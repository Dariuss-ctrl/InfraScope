# Serves the built dashboard and proxies /api/ to the Go API, so the browser
# talks to a single origin and never sees any backend address or credential.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Resolve the API through Docker's DNS on every request: if the API
    # container restarts with a new address, the proxy keeps working.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8081;

    # Security headers for every response. Locations below must not use
    # add_header, or nginx would drop these for them.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        # A variable upstream with no URI part forwards the request URI unchanged.
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        # $http_host keeps the port, which the API's same-origin (CSRF)
        # check compares against the browser's Origin header.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Fingerprinted build assets never change, so they can be cached for a year.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Single-page app: unknown paths fall back to index.html, which is never cached.
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
