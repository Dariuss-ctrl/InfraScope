openapi: 3.1.0
info:
  title: InfraScope API
  version: 0.1.0
  license:
    name: MIT
    identifier: MIT
  description: |
    Query and configuration API for InfraScope (docs/SPEC.md, section 8).

    Conventions:
    - Timestamps are RFC 3339 strings. Span and trace durations are integer
      nanoseconds (`duration_ns`); latencies aggregated from metrics are float
      seconds (`*_seconds`), matching their sources.
    - `from`/`to` default to the last hour. Search ranges are capped (24 h by default).
    - Lists use `limit` (default 50, max 500) and an opaque `cursor`; responses
      carry `next_cursor` while more results exist.
    - Errors use one envelope: `{"error": {"code", "message", "fields"}}`.
      Validation errors list every invalid parameter in `fields`; unknown and
      repeated query parameters are rejected.
    - Every route except health, status, login and the GitHub webhook needs
      the session cookie. The webhook is authenticated by its HMAC signature.
      A PostgreSQL outage is reported as `503 database_unavailable`, never as
      `401`, so it does not log anyone out.

    Every operation carries `x-phase`, the roadmap phase that implements it.
    Until then the server answers `501 not_implemented`.
servers:
  - url: http://localhost:8080
    description: Through the dashboard's nginx proxy (default Compose setup)
tags:
  - name: health
    description: Liveness, readiness and dependency status. Unauthenticated.
  - name: auth
    description: Session login and logout for the single admin account (ADR-0006).
  - name: services
    description: Rate, errors and duration per service, from Prometheus.
  - name: traces
    description: Trace search and span trees, from ClickHouse.
  - name: logs
    description: Structured log search, correlated with traces by trace ID.
  - name: diagnostics
    description: The detail behind a degraded status check, for logged-in users.
  - name: deployments
    description: >-
      DeployRadar: deployments reported by GitHub webhooks, and the before/after
      comparison of error rate and p95 latency made for each successful one
      (ADR-0007).
  - name: alerting
    description: Threshold rules and their state history (ADR-0005).
security:
  - session: []

paths:
  /healthz:
    get:
      tags: [health]
      summary: Liveness. Checks no dependencies.
      operationId: getLiveness
      x-phase: 0
      security: []
      responses:
        "200":
          description: The process is serving.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { const: ok }

  /readyz:
    get:
      tags: [health]
      summary: Readiness. 503 when a required dependency (PostgreSQL) is down.
      operationId: getReadiness
      x-phase: 0
      security: []
      responses:
        "200":
          description: Ready; optional dependencies may be down (`degraded`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthReport" }
        "503":
          description: A required dependency is down.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthReport" }

  /api/v1/status:
    get:
      tags: [health]
      summary: Dependency status for the dashboard banner. Always 200.
      operationId: getStatus
      x-phase: 0
      security: []
      responses:
        "200":
          description: Per-dependency reachability and probe latency. Error details are logged, never returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthReport" }

  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: Start a session.
      operationId: login
      x-phase: 2
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "204":
          description: Logged in.
          headers:
            Set-Cookie:
              description: "`infrascope_session=<token>; Path=/; HttpOnly; SameSite=Strict` (plus `Secure` over TLS)."
              schema: { type: string }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }

  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: End the current session.
      operationId: logout
      x-phase: 2
      responses:
        "204": { description: Session deleted and cookie cleared. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }

  /api/v1/auth/me:
    get:
      tags: [auth]
      summary: The logged-in user and when the session expires.
      operationId: getCurrentUser
      x-phase: 2
      responses:
        "200":
          description: The current session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentUser" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }

  /api/v1/services:
    get:
      tags: [services]
      summary: RED summary for every service with data in the range (FR-2).
      operationId: listServices
      x-phase: 2
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: Services ordered by name.
          content:
            application/json:
              schema:
                type: object
                required: [services]
                properties:
                  services:
                    type: array
                    items: { $ref: "#/components/schemas/ServiceSummary" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "503": { $ref: "#/components/responses/MetricsUnavailable" }
        "504": { $ref: "#/components/responses/QueryTimeout" }

  /api/v1/services/{service}/metrics:
    get:
      tags: [services]
      summary: Time series for one service's overview charts (FR-2).
      operationId: getServiceMetrics
      x-phase: 2
      parameters:
        - $ref: "#/components/parameters/ServicePath"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: step_seconds
          in: query
          description: Resolution. Chosen from the range when omitted.
          schema: { type: integer, minimum: 5, maximum: 3600 }
      responses:
        "200":
          description: Series aligned to the step. Steps without data have `v` null.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceMetrics" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/MetricsUnavailable" }
        "504": { $ref: "#/components/responses/QueryTimeout" }

  /api/v1/traces:
    get:
      tags: [traces]
      summary: Search traces (FR-3).
      operationId: searchTraces
      x-phase: 2
      parameters:
        - $ref: "#/components/parameters/ServiceQuery"
        - name: operation
          in: query
          description: Span name, matched exactly.
          schema: { type: string, maxLength: 256 }
        - name: min_duration_ms
          in: query
          schema: { type: integer, minimum: 0 }
        - name: max_duration_ms
          in: query
          schema: { type: integer, minimum: 0 }
        - name: status
          in: query
          description: Status of the root span, which records whether the request as a whole failed.
          schema: { type: string, enum: [any, ok, error], default: any }
        - name: sort
          in: query
          schema: { type: string, enum: [start_time, duration], default: start_time }
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Traces whose root span matches, newest or slowest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TraceSearchResult" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "503": { $ref: "#/components/responses/StorageUnavailable" }
        "504": { $ref: "#/components/responses/QueryTimeout" }

  /api/v1/traces/{traceId}:
    get:
      tags: [traces]
      summary: Every span of one trace (FR-3).
      operationId: getTrace
      x-phase: 2
      parameters:
        - $ref: "#/components/parameters/TraceIdPath"
      responses:
        "200":
          description: The trace, with time bounds usable for the matching log query.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Trace" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/StorageUnavailable" }
        "504": { $ref: "#/components/responses/QueryTimeout" }

  /api/v1/logs:
    get:
      tags: [logs]
      summary: Search log records (FR-4, FR-5).
      operationId: searchLogs
      x-phase: 2
      parameters:
        - $ref: "#/components/parameters/ServiceQuery"
        - name: severity
          in: query
          description: Minimum severity, compared on OpenTelemetry SeverityNumber ranges.
          schema: { type: string, enum: [trace, debug, info, warn, error, fatal] }
        - name: q
          in: query
          description: >-
            Words that must all appear in the body, matched case-insensitively.
            Letters and digits form words; anything else separates them. At most 8 words.
          schema: { type: string, maxLength: 200 }
        - name: trace_id
          in: query
          schema: { $ref: "#/components/schemas/TraceId" }
        - name: span_id
          in: query
          schema: { $ref: "#/components/schemas/SpanId" }
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Matching records, newest first. A trace with no logs gives an empty list.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogSearchResult" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "503": { $ref: "#/components/responses/StorageUnavailable" }
        "504": { $ref: "#/components/responses/QueryTimeout" }

  /api/v1/diagnostics/schema:
    get:
      tags: [diagnostics]
      summary: The telemetry tables and skip indexes that are missing, and what goes wrong without each.
      description: >-
        The detail behind a failed `clickhouse_schema` check in `/api/v1/status`, which is public and so
        names nothing. A missing index slows searches down; a missing table makes them fail.
      operationId: getSchemaDiagnostics
      x-phase: 3
      responses:
        "200":
          description: What is missing; an empty list when the schema is complete.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SchemaReport" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "503": { $ref: "#/components/responses/StorageUnavailable" }
        "504": { $ref: "#/components/responses/QueryTimeout" }

  /api/v1/webhooks/github:
    post:
      tags: [deployments]
      summary: Receive a GitHub webhook.
      operationId: githubWebhook
      x-phase: 4
      security: []
      description: |
        Public, authenticated by `X-Hub-Signature-256` (HMAC-SHA256 of the raw
        body with `INFRASCOPE_GITHUB_WEBHOOK_SECRET`) instead of a session. A
        wrong signature is refused and not stored.

        Every verified delivery is stored before it is processed, so a repeated
        `X-GitHub-Delivery` is answered as `duplicate` and not applied again,
        unless its earlier attempt failed (GitHub's redeliver). `deployment_status`
        events become deployment records; a late non-terminal status never
        overwrites a finished deployment. Other events are stored and ignored.
      parameters:
        - name: X-GitHub-Event
          in: header
          required: true
          schema: { type: string, maxLength: 64 }
        - name: X-GitHub-Delivery
          in: header
          required: true
          schema: { type: string, maxLength: 128 }
        - name: X-Hub-Signature-256
          in: header
          required: true
          description: "`sha256=` followed by the hex HMAC of the body."
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: GitHub's event payload, at most 1 MiB.
      responses:
        "200":
          description: The delivery was stored; `outcome` says what was done with it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookReceipt" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/InvalidSignature" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "503": { $ref: "#/components/responses/WebhookUnavailable" }

  /api/v1/deployments:
    get:
      tags: [deployments]
      summary: List deployments, newest first (FR-9).
      operationId: listDeployments
      x-phase: 4
      description: >-
        Each deployment carries its comparison's status, verdict and
        confidence, so a list can show verdicts without fetching each detail.
      parameters:
        - name: service
          in: query
          description: The `service_name` label value, matched exactly.
          schema: { type: string, maxLength: 128 }
        - name: environment
          in: query
          description: The `deployment_environment_name` label value, matched exactly.
          schema: { type: string, maxLength: 128 }
        - name: from
          in: query
          description: Only deployments created at or after this time.
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: Only deployments created before this time.
          schema: { type: string, format: date-time }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Deployments, newest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeploymentList" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }

  /api/v1/deployments/{deploymentId}:
    get:
      tags: [deployments]
      summary: One deployment with its status history and comparison (FR-9).
      operationId: getDeployment
      x-phase: 4
      description: >-
        The comparison's result is the evidence behind the verdict: the request
        and error counts and p95 of each window, and the exact PromQL, evaluation
        time and range behind every value, so each can be reproduced in
        Prometheus.
      parameters:
        - name: deploymentId
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        "200":
          description: The deployment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeploymentDetail" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }

  /api/v1/alert-rules:
    get:
      tags: [alerting]
      summary: List alert rules with their current state (FR-6).
      operationId: listAlertRules
      x-phase: 5
      responses:
        "501": { $ref: "#/components/responses/NotImplemented" }
        "200":
          description: All rules, ordered by name.
          content:
            application/json:
              schema:
                type: object
                required: [rules]
                properties:
                  rules:
                    type: array
                    items: { $ref: "#/components/schemas/AlertRule" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    post:
      tags: [alerting]
      summary: Create an alert rule.
      operationId: createAlertRule
      x-phase: 5
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AlertRuleInput" }
      responses:
        "501": { $ref: "#/components/responses/NotImplemented" }
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertRule" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/v1/alert-rules/{ruleId}:
    parameters:
      - $ref: "#/components/parameters/RuleIdPath"
    get:
      tags: [alerting]
      summary: Get one alert rule.
      operationId: getAlertRule
      x-phase: 5
      responses:
        "501": { $ref: "#/components/responses/NotImplemented" }
        "200":
          description: The rule.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertRule" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [alerting]
      summary: Replace an alert rule. Editing resets its state to `ok`.
      operationId: updateAlertRule
      x-phase: 5
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AlertRuleInput" }
      responses:
        "501": { $ref: "#/components/responses/NotImplemented" }
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertRule" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [alerting]
      summary: Delete an alert rule and its history.
      operationId: deleteAlertRule
      x-phase: 5
      responses:
        "501": { $ref: "#/components/responses/NotImplemented" }
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/alerts:
    get:
      tags: [alerting]
      summary: Alert state transitions (FR-6).
      operationId: listAlerts
      x-phase: 5
      parameters:
        - name: state
          in: query
          description: "`active` = pending or firing now; `all` includes resolved history."
          schema: { type: string, enum: [active, resolved, all], default: active }
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "501": { $ref: "#/components/responses/NotImplemented" }
        "200":
          description: Alerts, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [alerts]
                properties:
                  alerts:
                    type: array
                    items: { $ref: "#/components/schemas/Alert" }
                  next_cursor: { type: [string, "null"] }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: infrascope_session

  parameters:
    From:
      name: from
      in: query
      description: Start of the range (inclusive). Defaults to one hour before `to`.
      schema: { type: string, format: date-time }
    To:
      name: to
      in: query
      description: End of the range (exclusive). Defaults to now.
      schema: { type: string, format: date-time }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
    Cursor:
      name: cursor
      in: query
      description: Opaque value from a previous response's `next_cursor`.
      schema: { type: string, maxLength: 512 }
    ServiceQuery:
      name: service
      in: query
      schema: { type: string, maxLength: 256 }
    ServicePath:
      name: service
      in: path
      required: true
      schema: { type: string, maxLength: 256 }
    TraceIdPath:
      name: traceId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/TraceId" }
    RuleIdPath:
      name: ruleId
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }

  responses:
    InvalidArgument:
      description: Validation failed; `fields` lists each problem.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthenticated:
      description: Missing, expired or invalid session.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No such resource.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: Too many attempts; retry later.
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: A state-changing request came from another origin (`forbidden`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    StorageUnavailable:
      description: >-
        ClickHouse is unreachable (`storage_unavailable`), or PostgreSQL is
        unreachable while the session is checked (`database_unavailable`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    MetricsUnavailable:
      description: >-
        Prometheus is unreachable (`metrics_unavailable`), or PostgreSQL is
        unreachable while the session is checked (`database_unavailable`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    DatabaseUnavailable:
      description: PostgreSQL is unreachable (`database_unavailable`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    QueryTimeout:
      description: >-
        The query exceeded its time limit (`query_timeout`). Narrow the time
        range or add filters.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotImplemented:
      description: Defined in the contract but not built yet (`not_implemented`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InvalidSignature:
      description: The webhook signature does not match the body (`invalid_signature`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PayloadTooLarge:
      description: The body is over 1 MiB (`payload_too_large`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    WebhookUnavailable:
      description: >-
        Webhooks are off because no secret is configured (`webhooks_disabled`),
        or PostgreSQL is unreachable (`database_unavailable`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    DeploymentState:
      type: string
      enum: [pending, queued, in_progress, success, failure, error, inactive]
      description: >-
        GitHub's deployment states. `success`, `failure` and `error` are
        terminal; `inactive` means a newer deployment superseded this one.
    Verdict:
      type: string
      enum: [regression, improvement, no_change, insufficient_data]
    Deployment:
      type: object
      required: [id, provider, repository, provider_deployment_id, service, environment, ref, sha,
                 creator, description, created_at, state, state_at, finished_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        provider: { type: string, enum: [github] }
        repository: { type: string, description: "`owner/name`." }
        provider_deployment_id: { type: string }
        service: { type: string, description: The `service_name` label value the comparison measures. }
        environment: { type: string, description: The `deployment_environment_name` label value. }
        ref: { type: string }
        sha: { type: string }
        creator: { type: string }
        description: { type: string }
        created_at: { type: string, format: date-time }
        state: { $ref: "#/components/schemas/DeploymentState" }
        state_at:
          type: string
          format: date-time
          description: When the current state happened at the provider, not when its webhook arrived.
        finished_at:
          type: [string, "null"]
          format: date-time
          description: When the first terminal state happened; null while the deployment runs.
        updated_at: { type: string, format: date-time }
    DeploymentSummary:
      allOf:
        - $ref: "#/components/schemas/Deployment"
        - type: object
          required: [comparison_status, verdict, confidence]
          properties:
            comparison_status:
              type: [string, "null"]
              enum: [pending, done, failed, null]
              description: Null when no comparison was queued, because the deployment never succeeded.
            verdict:
              type: [string, "null"]
              enum: [regression, improvement, no_change, insufficient_data, null]
              description: Set once the comparison is done.
            confidence: { type: [number, "null"], minimum: 0, maximum: 1 }
    DeploymentList:
      type: object
      required: [deployments, next_cursor]
      properties:
        deployments:
          type: array
          items: { $ref: "#/components/schemas/DeploymentSummary" }
        next_cursor: { type: [string, "null"] }
    DeploymentDetail:
      allOf:
        - $ref: "#/components/schemas/Deployment"
        - type: object
          required: [changes, comparison]
          properties:
            changes:
              type: array
              description: Every status delivered, in status-time order, including ones the precedence rule did not apply.
              items: { $ref: "#/components/schemas/DeploymentChange" }
            comparison:
              oneOf:
                - $ref: "#/components/schemas/Comparison"
                - type: "null"
    DeploymentChange:
      type: object
      required: [delivery_id, state, state_at, applied, recorded_at]
      properties:
        delivery_id: { type: string }
        state: { $ref: "#/components/schemas/DeploymentState" }
        state_at: { type: string, format: date-time }
        applied:
          type: boolean
          description: False when the status arrived after a later one, or after a terminal one, and was only recorded.
        recorded_at: { type: string, format: date-time }
    TimeWindow:
      type: object
      required: [from, to]
      description: A half-open range [from, to).
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
    Comparison:
      type: object
      required: [status, attempts, before, after, error, result]
      properties:
        status:
          type: string
          enum: [pending, done, failed]
          description: >-
            `pending` until the after window has closed and been measured, and
            while Prometheus is unavailable; `failed` after repeated errors.
        attempts: { type: integer, minimum: 0 }
        before: { $ref: "#/components/schemas/TimeWindow" }
        after: { $ref: "#/components/schemas/TimeWindow" }
        error: { type: [string, "null"], description: "The last failure, while retrying or after giving up." }
        result:
          oneOf:
            - $ref: "#/components/schemas/ComparisonResult"
            - type: "null"
    WindowMeasurement:
      type: object
      required: [requests, errors, error_rate, p95_seconds]
      properties:
        requests: { type: number, minimum: 0, description: "Requests in the window; increase() extrapolates, so it may be fractional." }
        errors: { type: number, minimum: 0, description: Responses with a 5xx status. }
        error_rate: { type: number, minimum: 0, maximum: 1, description: "`errors / requests`, or 0 without requests." }
        p95_seconds: { type: [number, "null"], description: "p95 latency of non-5xx responses; null when the window had no latency histogram." }
    PromQuery:
      type: object
      required: [promql, time, range]
      properties:
        promql: { type: string, description: The exact query sent to Prometheus. }
        time: { type: string, format: date-time, description: Evaluation time of the instant query. }
        range: { type: string, description: "The range selector, for example `180s`." }
    ComparisonResult:
      type: object
      required: [verdict, error_rate_verdict, p95_verdict, confidence, reasons, before, after,
                 queries, method_version, computed_at]
      properties:
        verdict: { $ref: "#/components/schemas/Verdict" }
        error_rate_verdict: { $ref: "#/components/schemas/Verdict" }
        p95_verdict: { $ref: "#/components/schemas/Verdict" }
        confidence: { type: number, minimum: 0, maximum: 1, description: See ADR-0007 for what it means per signal. }
        reasons:
          type: array
          items: { type: string }
          description: Readable findings, for example "error rate 0.4% → 9.8% (+9.4 pp, p<0.001)".
        before: { $ref: "#/components/schemas/WindowMeasurement" }
        after: { $ref: "#/components/schemas/WindowMeasurement" }
        queries:
          type: object
          description: Keyed by what each measured, for example `after_errors`.
          additionalProperties: { $ref: "#/components/schemas/PromQuery" }
        method_version: { type: integer, description: The version of the comparison rules that produced this result. }
        computed_at: { type: string, format: date-time }
    WebhookReceipt:
      type: object
      required: [delivery_id, event, outcome]
      properties:
        delivery_id: { type: string }
        event: { type: string }
        outcome:
          type: string
          enum: [recorded, ignored, duplicate]
          description: >-
            `recorded`: a deployment status was stored. `ignored`: an event
            DeployRadar does not use. `duplicate`: this delivery ID was
            processed before.
        deployment_id: { type: integer, format: int64 }
        applied:
          type: boolean
          description: >-
            Whether the status changed the deployment's state. False for a
            status that arrived after a later one, or after a terminal one.
        comparison_queued:
          type: boolean
          description: True when this status made the deployment successful for the first time.
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - invalid_argument
                - unauthenticated
                - forbidden
                - not_found
                - rate_limited
                - not_implemented
                - storage_unavailable
                - metrics_unavailable
                - database_unavailable
                - query_timeout
                - invalid_signature
                - payload_too_large
                - webhooks_disabled
                - internal
            message: { type: string }
            fields:
              type: array
              items: { $ref: "#/components/schemas/FieldError" }

    FieldError:
      type: object
      required: [field, message]
      properties:
        field: { type: string, examples: [min_duration_ms] }
        message: { type: string, examples: [must not exceed max_duration_ms] }

    HealthReport:
      type: object
      required: [status, checked_at, dependencies]
      properties:
        status: { type: string, enum: [ok, degraded, unavailable] }
        checked_at: { type: string, format: date-time }
        dependencies:
          type: array
          items: { $ref: "#/components/schemas/DependencyStatus" }

    DependencyStatus:
      type: object
      required: [name, status, required, latency_ms]
      properties:
        name: { type: string, examples: [clickhouse] }
        status: { type: string, enum: [up, down] }
        required: { type: boolean }
        latency_ms: { type: integer, minimum: 0 }

    LoginRequest:
      type: object
      required: [username, password]
      additionalProperties: false
      properties:
        username: { type: string, minLength: 1, maxLength: 128 }
        password: { type: string, minLength: 1, maxLength: 72, format: password, description: At most 72 bytes (bcrypt's limit). }

    CurrentUser:
      type: object
      required: [username, expires_at]
      properties:
        username: { type: string }
        expires_at: { type: string, format: date-time }

    TraceId:
      type: string
      pattern: "^[0-9a-f]{32}$"
    SpanId:
      type: string
      pattern: "^[0-9a-f]{16}$"

    LatencySeconds:
      type: object
      properties:
        p50: { type: [number, "null"] }
        p95: { type: [number, "null"] }
        p99: { type: [number, "null"] }

    ServiceSummary:
      type: object
      required: [name, request_rate, error_rate, latency_seconds]
      description: Values are null when the service has no data in the range.
      properties:
        name: { type: string }
        request_rate: { type: [number, "null"], description: Requests per second. }
        error_rate: { type: [number, "null"], minimum: 0, maximum: 1, description: Share of 5xx responses. }
        latency_seconds: { $ref: "#/components/schemas/LatencySeconds" }

    Point:
      type: object
      required: [t, v]
      properties:
        t: { type: string, format: date-time }
        v: { type: [number, "null"] }

    ServiceMetrics:
      type: object
      required: [service, step_seconds, series]
      properties:
        service: { type: string }
        step_seconds: { type: integer }
        series:
          type: object
          required: [request_rate, error_rate, latency_p50_seconds, latency_p95_seconds, latency_p99_seconds]
          properties:
            request_rate: { type: array, items: { $ref: "#/components/schemas/Point" } }
            error_rate: { type: array, items: { $ref: "#/components/schemas/Point" } }
            latency_p50_seconds: { type: array, items: { $ref: "#/components/schemas/Point" } }
            latency_p95_seconds: { type: array, items: { $ref: "#/components/schemas/Point" } }
            latency_p99_seconds: { type: array, items: { $ref: "#/components/schemas/Point" } }

    TraceSummary:
      type: object
      required: [trace_id, root_service, root_operation, start_time, duration_ns, span_count, has_error]
      properties:
        trace_id: { $ref: "#/components/schemas/TraceId" }
        root_service: { type: string }
        root_operation: { type: string }
        start_time: { type: string, format: date-time }
        duration_ns: { type: integer, format: int64, minimum: 0 }
        span_count: { type: integer, minimum: 1 }
        has_error: { type: boolean }

    TraceSearchResult:
      type: object
      required: [traces]
      properties:
        traces:
          type: array
          items: { $ref: "#/components/schemas/TraceSummary" }
        next_cursor: { type: [string, "null"] }

    Trace:
      type: object
      required: [trace_id, start_time, end_time, spans, truncated]
      properties:
        trace_id: { $ref: "#/components/schemas/TraceId" }
        start_time: { type: string, format: date-time }
        end_time: { type: string, format: date-time }
        spans:
          type: array
          description: Earliest first.
          items: { $ref: "#/components/schemas/Span" }
        truncated:
          type: boolean
          description: The trace has more spans than one response carries (10,000); only the earliest are included.

    Span:
      type: object
      required: [span_id, parent_span_id, service, name, kind, start_time, duration_ns, status]
      properties:
        span_id: { $ref: "#/components/schemas/SpanId" }
        parent_span_id:
          description: Null for a root span.
          oneOf:
            - $ref: "#/components/schemas/SpanId"
            - type: "null"
        service: { type: string }
        name: { type: string }
        kind: { type: string, enum: [server, client, internal, producer, consumer, unspecified] }
        start_time: { type: string, format: date-time }
        duration_ns: { type: integer, format: int64, minimum: 0 }
        status: { type: string, enum: [unset, ok, error] }
        status_message: { type: string }
        attributes:
          type: object
          additionalProperties: { type: string }
        resource_attributes:
          type: object
          additionalProperties: { type: string }
        events:
          type: array
          items:
            type: object
            required: [time, name]
            properties:
              time: { type: string, format: date-time }
              name: { type: string, examples: [exception] }
              attributes:
                type: object
                additionalProperties: { type: string }

    LogRecord:
      type: object
      required: [timestamp, service, severity_number, severity_text, body]
      properties:
        timestamp: { type: string, format: date-time }
        service: { type: string }
        severity_number: { type: integer, minimum: 0, maximum: 24 }
        severity_text: { type: string }
        body: { type: string, description: Untrusted content; clients must render it as text. }
        trace_id:
          oneOf:
            - $ref: "#/components/schemas/TraceId"
            - type: "null"
        span_id:
          oneOf:
            - $ref: "#/components/schemas/SpanId"
            - type: "null"
        attributes:
          type: object
          additionalProperties: { type: string }

    LogSearchResult:
      type: object
      required: [logs]
      properties:
        logs:
          type: array
          items: { $ref: "#/components/schemas/LogRecord" }
        next_cursor: { type: [string, "null"] }

    SchemaReport:
      type: object
      required: [checked_at, complete, missing]
      properties:
        checked_at: { type: string, format: date-time }
        complete: { type: boolean }
        missing:
          type: array
          items: { $ref: "#/components/schemas/SchemaItem" }

    SchemaItem:
      type: object
      required: [kind, table, name, effect]
      properties:
        kind: { type: string, enum: [table, index] }
        table: { type: string, examples: [otel.otel_logs] }
        name: { type: string, description: "The index; for a table, the table itself.", examples: [idx_lower_body] }
        effect: { type: string, description: What goes wrong while it is missing. }

    AlertRuleInput:
      type: object
      required: [name, service, signal, comparator, threshold, window_seconds, for_seconds]
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        service: { type: string, minLength: 1, maxLength: 256 }
        signal: { type: string, enum: [error_rate, latency_p95, request_rate] }
        comparator: { type: string, enum: [">", "<"] }
        threshold: { type: number, description: "Error rate as a 0-1 share, latency in seconds, request rate per second." }
        window_seconds: { type: integer, minimum: 60, maximum: 3600 }
        for_seconds: { type: integer, minimum: 0, maximum: 3600 }
        enabled: { type: boolean, default: true }

    AlertRule:
      allOf:
        - $ref: "#/components/schemas/AlertRuleInput"
        - type: object
          required: [id, state, created_at, updated_at]
          properties:
            id: { type: integer, format: int64 }
            state: { type: string, enum: [ok, pending, firing] }
            last_evaluated_at: { type: [string, "null"], format: date-time }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }

    Alert:
      type: object
      required: [rule_id, rule_name, service, state, value, observed_at]
      properties:
        rule_id: { type: integer, format: int64 }
        rule_name: { type: string }
        service: { type: string }
        state: { type: string, enum: [pending, firing, resolved] }
        value: { type: number, description: The signal's value when the transition happened. }
        observed_at: { type: string, format: date-time }
