openapi: 3.1.0
info:
  title: InfraScope API
  version: 0.1.0
  license:
    name: MIT
    identifier: MIT
  description: |
    Query and configuration API for InfraScope (docs/SPEC.md, section 8).

    Conventions:
    - Timestamps are RFC 3339 strings. Span and trace durations are integer
      nanoseconds (`duration_ns`); latencies aggregated from metrics are float
      seconds (`*_seconds`), matching their sources.
    - `from`/`to` default to the last hour. Search ranges are capped (24 h by default).
    - Lists use `limit` (default 50, max 500) and an opaque `cursor`; responses
      carry `next_cursor` while more results exist.
    - Errors use one envelope: `{"error": {"code", "message", "fields"}}`.

    Every operation carries `x-phase`, the roadmap phase that implements it.
    Until then the server answers `501 not_implemented`.
servers:
  - url: http://localhost:8080
    description: Through the dashboard's nginx proxy (default Compose setup)
tags:
  - name: health
    description: Liveness, readiness and dependency status. Unauthenticated.
  - name: auth
    description: Session login and logout for the single admin account (ADR-0006).
  - name: services
    description: Rate, errors and duration per service, from Prometheus.
  - name: traces
    description: Trace search and span trees, from ClickHouse.
  - name: logs
    description: Structured log search, correlated with traces by trace ID.
  - name: alerting
    description: Threshold rules and their state history (ADR-0005).
security:
  - session: []

paths:
  /healthz:
    get:
      tags: [health]
      summary: Liveness. Checks no dependencies.
      operationId: getLiveness
      x-phase: 0
      security: []
      responses:
        "200":
          description: The process is serving.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { const: ok }

  /readyz:
    get:
      tags: [health]
      summary: Readiness. 503 when a required dependency (PostgreSQL) is down.
      operationId: getReadiness
      x-phase: 0
      security: []
      responses:
        "200":
          description: Ready; optional dependencies may be down (`degraded`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthReport" }
        "503":
          description: A required dependency is down.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthReport" }

  /api/v1/status:
    get:
      tags: [health]
      summary: Dependency status for the dashboard banner. Always 200.
      operationId: getStatus
      x-phase: 0
      security: []
      responses:
        "200":
          description: Per-dependency reachability and probe latency. Error details are logged, never returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthReport" }

  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: Start a session.
      operationId: login
      x-phase: 2
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "204":
          description: Logged in.
          headers:
            Set-Cookie:
              description: "`infrascope_session=<token>; Path=/; HttpOnly; SameSite=Strict` (plus `Secure` over TLS)."
              schema: { type: string }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: End the current session.
      operationId: logout
      x-phase: 2
      responses:
        "204": { description: Session deleted and cookie cleared. }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/v1/services:
    get:
      tags: [services]
      summary: RED summary for every service with data in the range (FR-2).
      operationId: listServices
      x-phase: 2
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: Services ordered by name.
          content:
            application/json:
              schema:
                type: object
                required: [services]
                properties:
                  services:
                    type: array
                    items: { $ref: "#/components/schemas/ServiceSummary" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "503": { $ref: "#/components/responses/MetricsUnavailable" }

  /api/v1/services/{service}/metrics:
    get:
      tags: [services]
      summary: Time series for one service's overview charts (FR-2).
      operationId: getServiceMetrics
      x-phase: 2
      parameters:
        - $ref: "#/components/parameters/ServicePath"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: step_seconds
          in: query
          description: Resolution. Chosen from the range when omitted.
          schema: { type: integer, minimum: 5, maximum: 3600 }
      responses:
        "200":
          description: Series aligned to the step.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceMetrics" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/MetricsUnavailable" }

  /api/v1/traces:
    get:
      tags: [traces]
      summary: Search traces (FR-3).
      operationId: searchTraces
      x-phase: 2
      parameters:
        - $ref: "#/components/parameters/ServiceQuery"
        - name: operation
          in: query
          description: Span name, matched exactly.
          schema: { type: string, maxLength: 256 }
        - name: min_duration_ms
          in: query
          schema: { type: integer, minimum: 0 }
        - name: max_duration_ms
          in: query
          schema: { type: integer, minimum: 0 }
        - name: status
          in: query
          schema: { type: string, enum: [any, ok, error], default: any }
        - name: sort
          in: query
          schema: { type: string, enum: [start_time, duration], default: start_time }
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Matching traces, newest or slowest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TraceSearchResult" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "503": { $ref: "#/components/responses/StorageUnavailable" }

  /api/v1/traces/{traceId}:
    get:
      tags: [traces]
      summary: Every span of one trace (FR-3).
      operationId: getTrace
      x-phase: 2
      parameters:
        - $ref: "#/components/parameters/TraceIdPath"
      responses:
        "200":
          description: The trace, with time bounds usable for the matching log query.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Trace" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/StorageUnavailable" }

  /api/v1/logs:
    get:
      tags: [logs]
      summary: Search log records (FR-4, FR-5).
      operationId: searchLogs
      x-phase: 2
      parameters:
        - $ref: "#/components/parameters/ServiceQuery"
        - name: severity
          in: query
          description: Minimum severity, compared on OpenTelemetry SeverityNumber ranges.
          schema: { type: string, enum: [trace, debug, info, warn, error, fatal] }
        - name: q
          in: query
          description: Case-insensitive token match on the log body.
          schema: { type: string, maxLength: 200 }
        - name: trace_id
          in: query
          schema: { $ref: "#/components/schemas/TraceId" }
        - name: span_id
          in: query
          schema: { $ref: "#/components/schemas/SpanId" }
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Matching records, newest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogSearchResult" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "503": { $ref: "#/components/responses/StorageUnavailable" }

  /api/v1/alert-rules:
    get:
      tags: [alerting]
      summary: List alert rules with their current state (FR-6).
      operationId: listAlertRules
      x-phase: 4
      responses:
        "200":
          description: All rules, ordered by name.
          content:
            application/json:
              schema:
                type: object
                required: [rules]
                properties:
                  rules:
                    type: array
                    items: { $ref: "#/components/schemas/AlertRule" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    post:
      tags: [alerting]
      summary: Create an alert rule.
      operationId: createAlertRule
      x-phase: 4
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AlertRuleInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertRule" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/v1/alert-rules/{ruleId}:
    parameters:
      - $ref: "#/components/parameters/RuleIdPath"
    get:
      tags: [alerting]
      summary: Get one alert rule.
      operationId: getAlertRule
      x-phase: 4
      responses:
        "200":
          description: The rule.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertRule" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [alerting]
      summary: Replace an alert rule. Editing resets its state to `ok`.
      operationId: updateAlertRule
      x-phase: 4
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AlertRuleInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertRule" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [alerting]
      summary: Delete an alert rule and its history.
      operationId: deleteAlertRule
      x-phase: 4
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/alerts:
    get:
      tags: [alerting]
      summary: Alert state transitions (FR-6).
      operationId: listAlerts
      x-phase: 4
      parameters:
        - name: state
          in: query
          description: "`active` = pending or firing now; `all` includes resolved history."
          schema: { type: string, enum: [active, resolved, all], default: active }
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Alerts, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [alerts]
                properties:
                  alerts:
                    type: array
                    items: { $ref: "#/components/schemas/Alert" }
                  next_cursor: { type: [string, "null"] }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: infrascope_session

  parameters:
    From:
      name: from
      in: query
      description: Start of the range (inclusive). Defaults to one hour before `to`.
      schema: { type: string, format: date-time }
    To:
      name: to
      in: query
      description: End of the range (exclusive). Defaults to now.
      schema: { type: string, format: date-time }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
    Cursor:
      name: cursor
      in: query
      description: Opaque value from a previous response's `next_cursor`.
      schema: { type: string, maxLength: 512 }
    ServiceQuery:
      name: service
      in: query
      schema: { type: string, maxLength: 256 }
    ServicePath:
      name: service
      in: path
      required: true
      schema: { type: string, maxLength: 256 }
    TraceIdPath:
      name: traceId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/TraceId" }
    RuleIdPath:
      name: ruleId
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }

  responses:
    InvalidArgument:
      description: Validation failed; `fields` lists each problem.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthenticated:
      description: Missing, expired or invalid session.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No such resource.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: Too many attempts; retry later.
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    StorageUnavailable:
      description: ClickHouse is unreachable or timed out (`storage_unavailable`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    MetricsUnavailable:
      description: Prometheus is unreachable or timed out (`metrics_unavailable`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - invalid_argument
                - unauthenticated
                - not_found
                - rate_limited
                - not_implemented
                - storage_unavailable
                - metrics_unavailable
                - internal
            message: { type: string }
            fields:
              type: array
              items: { $ref: "#/components/schemas/FieldError" }

    FieldError:
      type: object
      required: [field, message]
      properties:
        field: { type: string, examples: [min_duration_ms] }
        message: { type: string, examples: [must not exceed max_duration_ms] }

    HealthReport:
      type: object
      required: [status, checked_at, dependencies]
      properties:
        status: { type: string, enum: [ok, degraded, unavailable] }
        checked_at: { type: string, format: date-time }
        dependencies:
          type: array
          items: { $ref: "#/components/schemas/DependencyStatus" }

    DependencyStatus:
      type: object
      required: [name, status, required, latency_ms]
      properties:
        name: { type: string, examples: [clickhouse] }
        status: { type: string, enum: [up, down] }
        required: { type: boolean }
        latency_ms: { type: integer, minimum: 0 }

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, maxLength: 128 }
        password: { type: string, maxLength: 256, format: password }

    TraceId:
      type: string
      pattern: "^[0-9a-f]{32}$"
    SpanId:
      type: string
      pattern: "^[0-9a-f]{16}$"

    LatencySeconds:
      type: object
      properties:
        p50: { type: [number, "null"] }
        p95: { type: [number, "null"] }
        p99: { type: [number, "null"] }

    ServiceSummary:
      type: object
      required: [name, request_rate, error_rate, latency_seconds]
      description: Values are null when the service has no data in the range.
      properties:
        name: { type: string }
        request_rate: { type: [number, "null"], description: Requests per second. }
        error_rate: { type: [number, "null"], minimum: 0, maximum: 1, description: Share of 5xx responses. }
        latency_seconds: { $ref: "#/components/schemas/LatencySeconds" }

    Point:
      type: object
      required: [t, v]
      properties:
        t: { type: string, format: date-time }
        v: { type: [number, "null"] }

    ServiceMetrics:
      type: object
      required: [service, step_seconds, series]
      properties:
        service: { type: string }
        step_seconds: { type: integer }
        series:
          type: object
          required: [request_rate, error_rate, latency_p50_seconds, latency_p95_seconds, latency_p99_seconds]
          properties:
            request_rate: { type: array, items: { $ref: "#/components/schemas/Point" } }
            error_rate: { type: array, items: { $ref: "#/components/schemas/Point" } }
            latency_p50_seconds: { type: array, items: { $ref: "#/components/schemas/Point" } }
            latency_p95_seconds: { type: array, items: { $ref: "#/components/schemas/Point" } }
            latency_p99_seconds: { type: array, items: { $ref: "#/components/schemas/Point" } }

    TraceSummary:
      type: object
      required: [trace_id, root_service, root_operation, start_time, duration_ns, span_count, has_error]
      properties:
        trace_id: { $ref: "#/components/schemas/TraceId" }
        root_service: { type: string }
        root_operation: { type: string }
        start_time: { type: string, format: date-time }
        duration_ns: { type: integer, format: int64, minimum: 0 }
        span_count: { type: integer, minimum: 1 }
        has_error: { type: boolean }

    TraceSearchResult:
      type: object
      required: [traces]
      properties:
        traces:
          type: array
          items: { $ref: "#/components/schemas/TraceSummary" }
        next_cursor: { type: [string, "null"] }

    Trace:
      type: object
      required: [trace_id, start_time, end_time, spans]
      properties:
        trace_id: { $ref: "#/components/schemas/TraceId" }
        start_time: { type: string, format: date-time }
        end_time: { type: string, format: date-time }
        spans:
          type: array
          items: { $ref: "#/components/schemas/Span" }

    Span:
      type: object
      required: [span_id, parent_span_id, service, name, kind, start_time, duration_ns, status]
      properties:
        span_id: { $ref: "#/components/schemas/SpanId" }
        parent_span_id:
          description: Null for a root span.
          oneOf:
            - $ref: "#/components/schemas/SpanId"
            - type: "null"
        service: { type: string }
        name: { type: string }
        kind: { type: string, enum: [server, client, internal, producer, consumer, unspecified] }
        start_time: { type: string, format: date-time }
        duration_ns: { type: integer, format: int64, minimum: 0 }
        status: { type: string, enum: [unset, ok, error] }
        status_message: { type: string }
        attributes:
          type: object
          additionalProperties: { type: string }
        resource_attributes:
          type: object
          additionalProperties: { type: string }
        events:
          type: array
          items:
            type: object
            required: [time, name]
            properties:
              time: { type: string, format: date-time }
              name: { type: string, examples: [exception] }
              attributes:
                type: object
                additionalProperties: { type: string }

    LogRecord:
      type: object
      required: [timestamp, service, severity_number, severity_text, body]
      properties:
        timestamp: { type: string, format: date-time }
        service: { type: string }
        severity_number: { type: integer, minimum: 0, maximum: 24 }
        severity_text: { type: string }
        body: { type: string, description: Untrusted content; clients must render it as text. }
        trace_id:
          oneOf:
            - $ref: "#/components/schemas/TraceId"
            - type: "null"
        span_id:
          oneOf:
            - $ref: "#/components/schemas/SpanId"
            - type: "null"
        attributes:
          type: object
          additionalProperties: { type: string }

    LogSearchResult:
      type: object
      required: [logs]
      properties:
        logs:
          type: array
          items: { $ref: "#/components/schemas/LogRecord" }
        next_cursor: { type: [string, "null"] }

    AlertRuleInput:
      type: object
      required: [name, service, signal, comparator, threshold, window_seconds, for_seconds]
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        service: { type: string, minLength: 1, maxLength: 256 }
        signal: { type: string, enum: [error_rate, latency_p95, request_rate] }
        comparator: { type: string, enum: [">", "<"] }
        threshold: { type: number, description: "Error rate as a 0-1 share, latency in seconds, request rate per second." }
        window_seconds: { type: integer, minimum: 60, maximum: 3600 }
        for_seconds: { type: integer, minimum: 0, maximum: 3600 }
        enabled: { type: boolean, default: true }

    AlertRule:
      allOf:
        - $ref: "#/components/schemas/AlertRuleInput"
        - type: object
          required: [id, state, created_at, updated_at]
          properties:
            id: { type: integer, format: int64 }
            state: { type: string, enum: [ok, pending, firing] }
            last_evaluated_at: { type: [string, "null"], format: date-time }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }

    Alert:
      type: object
      required: [rule_id, rule_name, service, state, value, observed_at]
      properties:
        rule_id: { type: integer, format: int64 }
        rule_name: { type: string }
        service: { type: string }
        state: { type: string, enum: [pending, firing, resolved] }
        value: { type: number, description: The signal's value when the transition happened. }
        observed_at: { type: string, format: date-time }
