name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [apps/api, apps/demo-service]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          # No third-party modules yet, so there is no go.sum to key a cache on.
          cache: false
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "gofmt needed:"; echo "$unformatted"; exit 1; fi
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: apps/dashboard/.nvmrc
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

  config:
    name: Validate configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compose file
        run: docker compose --env-file .env.example -f deployments/docker-compose.yml -f deployments/docker-compose.debug.yml config --quiet
      - name: Collector config (pinned binary)
        run: |
          docker run --rm --env-file .env.example \
            -v "$PWD/telemetry:/cfg:ro" \
            otel/opentelemetry-collector-contrib:0.164.0 validate --config=/cfg/otel-collector.yaml
      - name: Prometheus config (pinned promtool)
        run: |
          docker run --rm -v "$PWD/telemetry:/cfg:ro" --entrypoint promtool \
            prom/prometheus:v3.15.1 check config /cfg/prometheus.yaml

  smoke:
    name: Stack smoke test
    runs-on: ubuntu-latest
    needs: [go, dashboard, config]
    steps:
      - uses: actions/checkout@v7
      - run: cp .env.example .env
      - name: Start the stack
        run: docker compose --env-file .env -f deployments/docker-compose.yml up -d --build --wait --wait-timeout 300
      - run: bash scripts/smoke.sh
      - name: Logs on failure
        if: failure()
        run: docker compose --env-file .env -f deployments/docker-compose.yml logs --no-color --tail=200
      - name: Tear down
        if: always()
        run: docker compose --env-file .env -f deployments/docker-compose.yml down -v
