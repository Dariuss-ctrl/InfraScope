name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [apps/api, apps/demo-service, tests/pipeline]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          cache-dependency-path: "**/go.sum"
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "gofmt needed:"; echo "$unformatted"; exit 1; fi
      - run: go vet ./...
      - name: go vet (integration tests)
        run: go vet -tags integration ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          working-directory: ${{ matrix.module }}
      - run: go test -race ./...
      - run: go build ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  integration:
    name: API integration tests
    runs-on: ubuntu-latest
    needs: [go]
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          cache-dependency-path: "**/go.sum"
      - name: Real PostgreSQL, ClickHouse and Prometheus in disposable containers
        run: go test -tags integration -count=1 -p 1 -timeout 20m ./...

  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: apps/dashboard/.nvmrc
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

  config:
    name: Validate configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compose file
        run: docker compose --env-file .env.example -f deployments/docker-compose.yml -f deployments/docker-compose.debug.yml config --quiet
      - name: Collector config (pinned binary)
        run: |
          docker run --rm --env-file .env.example \
            -v "$PWD/telemetry:/cfg:ro" \
            otel/opentelemetry-collector-contrib:0.164.0 validate --config=/cfg/otel-collector.yaml
      - name: Prometheus config (pinned promtool)
        run: |
          docker run --rm -v "$PWD/telemetry:/cfg:ro" --entrypoint promtool \
            prom/prometheus:v3.15.1 check config /cfg/prometheus.yaml

  smoke:
    name: Stack smoke and pipeline tests
    runs-on: ubuntu-latest
    needs: [go, integration, dashboard, config]
    env:
      COMPOSE: docker compose --env-file .env -f deployments/docker-compose.yml
      # A smaller seed keeps first start fast; the pipeline test needs only a few rows.
      DEMO_SEED_ORDERS: "100000"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          cache-dependency-path: "**/go.sum"
      - run: cp .env.example .env
      - name: Start the stack
        run: $COMPOSE up -d --build --wait --wait-timeout 300
      - run: bash scripts/smoke.sh
      - name: Pipeline test (request -> trace, logs and metrics, through the API)
        run: |
          set -a; . ./.env; set +a
          cd tests/pipeline && INFRASCOPE_PIPELINE=1 go test -count=1 -v ./...
      - name: Logs on failure
        if: failure()
        run: $COMPOSE logs --no-color --tail=200
      - name: Tear down
        if: always()
        run: $COMPOSE down -v
