# Debug override: publishes internal ports on localhost only.
#   docker compose --env-file .env -f deployments/docker-compose.yml \
#     -f deployments/docker-compose.debug.yml up -d --wait
# (or `make up-debug`). Never use it on a shared host.

services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"
  clickhouse:
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
  prometheus:
    ports:
      - "127.0.0.1:9090:9090"
  otel-collector:
    ports:
      - "127.0.0.1:8888:8888"
      - "127.0.0.1:13133:13133"
  api:
    ports:
      - "127.0.0.1:8081:8081"
