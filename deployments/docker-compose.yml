# InfraScope stack. Run from the repository root:
#   docker compose --env-file .env -f deployments/docker-compose.yml up -d --build --wait
# (or `make up`). Relative paths below resolve from this directory.
#
# Only the dashboard, the demo service and OTLP are published, and they bind
# to ${INFRASCOPE_BIND} (127.0.0.1 by default). Everything else stays on the
# internal network; docker-compose.debug.yml exposes it on localhost when needed.

name: infrascope

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set POSTGRES_SUPERUSER_PASSWORD in .env}
      INFRASCOPE_DB_PASSWORD: ${INFRASCOPE_DB_PASSWORD:?set INFRASCOPE_DB_PASSWORD in .env}
      SHOP_DB_PASSWORD: ${SHOP_DB_PASSWORD:?set SHOP_DB_PASSWORD in .env}
    volumes:
      # PostgreSQL 18+ images keep data under /var/lib/postgresql/<major>/docker.
      - postgres-data:/var/lib/postgresql
      - ../storage/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP rather than the socket: the init-time server only listens on the
      # socket, so this passes only after init scripts have finished.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:26.8.36.3
    environment:
      CLICKHOUSE_DB: otel
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:?set CLICKHOUSE_USER in .env}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ../storage/clickhouse/config.d/prometheus.xml:/etc/clickhouse-server/config.d/prometheus.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --web.enable-otlp-receiver
    volumes:
      - ../telemetry/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9090/-/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.164.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      TELEMETRY_TTL: ${TELEMETRY_TTL:-72h}
      INFRASCOPE_ENVIRONMENT: ${INFRASCOPE_ENVIRONMENT:-local}
    volumes:
      - ../telemetry/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "${INFRASCOPE_BIND:-127.0.0.1}:${OTLP_GRPC_PORT:-4317}:4317"
      - "${INFRASCOPE_BIND:-127.0.0.1}:${OTLP_HTTP_PORT:-4318}:4318"
    # The image is built FROM scratch (no shell), so there is no container
    # healthcheck; the API's /api/v1/status probes the collector instead.
    depends_on:
      clickhouse:
        # The ClickHouse exporter creates its schema at startup (ADR-0004).
        condition: service_healthy
      prometheus:
        condition: service_started
    restart: unless-stopped

  api:
    build: ../apps/api
    image: infrascope/api:dev
    environment:
      INFRASCOPE_HTTP_ADDR: ":8081"
      INFRASCOPE_DATABASE_URL: postgres://infrascope:${INFRASCOPE_DB_PASSWORD}@postgres:5432/infrascope?sslmode=disable
      INFRASCOPE_CLICKHOUSE_URL: http://clickhouse:8123
      INFRASCOPE_CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      INFRASCOPE_CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      INFRASCOPE_PROMETHEUS_URL: http://prometheus:9090
      INFRASCOPE_COLLECTOR_HEALTH_URL: http://otel-collector:13133
      INFRASCOPE_ADMIN_USER: ${INFRASCOPE_ADMIN_USER:-admin}
      INFRASCOPE_ADMIN_PASSWORD: ${INFRASCOPE_ADMIN_PASSWORD:?set INFRASCOPE_ADMIN_PASSWORD in .env}
      # Set to true when the dashboard is served over HTTPS.
      INFRASCOPE_COOKIE_SECURE: ${INFRASCOPE_COOKIE_SECURE:-false}
      # DeployRadar (FR-9). The webhook route stays off while the secret is empty.
      INFRASCOPE_GITHUB_WEBHOOK_SECRET: ${INFRASCOPE_GITHUB_WEBHOOK_SECRET:-}
      INFRASCOPE_DEPLOYRADAR_WINDOW: ${INFRASCOPE_DEPLOYRADAR_WINDOW:-10m}
      INFRASCOPE_DEPLOYRADAR_SETTLE: ${INFRASCOPE_DEPLOYRADAR_SETTLE:-2m}
      INFRASCOPE_DEPLOYRADAR_MIN_REQUESTS: ${INFRASCOPE_DEPLOYRADAR_MIN_REQUESTS:-200}
      OTEL_SERVICE_NAME: infrascope-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_METRIC_EXPORT_INTERVAL: "15000"
    healthcheck:
      test: ["CMD", "/usr/local/bin/api", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      # Deliberately not ClickHouse or Prometheus: the API must start and
      # serve in degraded mode when telemetry storage is down (NFR-1).
      postgres:
        condition: service_healthy
    restart: unless-stopped

  demo-service:
    build: ../apps/demo-service
    image: infrascope/demo-service:dev
    environment:
      DEMO_HTTP_ADDR: ":8082"
      DEMO_DATABASE_URL: postgres://shop:${SHOP_DB_PASSWORD}@postgres:5432/shop?sslmode=disable
      DEMO_SLOW_QUERY_THRESHOLD: ${DEMO_SLOW_QUERY_THRESHOLD:-100ms}
      DEMO_SEED_PRODUCTS: ${DEMO_SEED_PRODUCTS:-10000}
      DEMO_SEED_CUSTOMERS: ${DEMO_SEED_CUSTOMERS:-100000}
      DEMO_SEED_ORDERS: ${DEMO_SEED_ORDERS:-1000000}
      # Set by scripts/deploy-demo.sh: which release is running, and the bad
      # release's share of failing requests (0 = healthy).
      DEMO_SERVICE_VERSION: ${DEMO_SERVICE_VERSION:-}
      DEMO_FAULT_ERROR_RATE: ${DEMO_FAULT_ERROR_RATE:-0}
      OTEL_SERVICE_NAME: demo-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_METRIC_EXPORT_INTERVAL: "15000"
    ports:
      - "${INFRASCOPE_BIND:-127.0.0.1}:${DEMO_SERVICE_PORT:-8082}:8082"
    healthcheck:
      test: ["CMD", "/usr/local/bin/demo-service", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10
      # The server starts listening only after the first-start seed, which
      # inserts about a million rows with the default sizes.
      start_period: 300s
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
    restart: unless-stopped

  dashboard:
    build: ../apps/dashboard
    image: infrascope/dashboard:dev
    ports:
      - "${INFRASCOPE_BIND:-127.0.0.1}:${DASHBOARD_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  k6:
    image: grafana/k6:2.3.0
    profiles: ["load"]
    command: ["run", "/scripts/workload.js"]
    environment:
      TARGET_URL: http://demo-service:8082
      RATE: ${RATE:-20}
      DURATION: ${DURATION:-2m}
      # The workload picks existing products, customers and orders.
      SEED_PRODUCTS: ${DEMO_SEED_PRODUCTS:-10000}
      SEED_CUSTOMERS: ${DEMO_SEED_CUSTOMERS:-100000}
      SEED_ORDERS: ${DEMO_SEED_ORDERS:-1000000}
    volumes:
      - ../tests/load:/scripts:ro
    depends_on:
      demo-service:
        condition: service_healthy

volumes:
  postgres-data:
  clickhouse-data:
  prometheus-data:
